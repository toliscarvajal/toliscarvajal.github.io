<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan">
<meta name="theme-color" content="#05060A">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Japan · Itinerary</title>
<link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app-icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/inter.css">
<style>
:root{ --bg:#05060A; --card:rgba(34,34,36,.72); --rim:rgba(255,255,255,.12); --label:#FFFFFF;
  --label2:rgba(235,235,245,.62); --tint:rgb(0,145,255); --bad:rgb(255,105,97); --ok:rgb(48,209,88);
  --ease:cubic-bezier(.2,.8,.2,1); }
*{ box-sizing:border-box }
html,body{ height:100% }
body{ margin:0; color:var(--label); background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 0%, #10204f 0%, #070b1d 55%, #05060A 100%);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif;
  font-size:17px; line-height:1.4; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  display:flex; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px); }
main{ width:100%; max-width:380px; text-align:center }
.icon{ width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 20px;
  box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.1) }
h1{ font-size:30px; font-weight:700; letter-spacing:-.6px; margin:0 0 6px }
.sub{ color:var(--label2); font-size:15px; margin:0 0 28px }
.card{ background:var(--card); border-radius:24px; padding:20px; box-shadow:inset 0 0 0 1px var(--rim);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); text-align:left }
label{ display:block; font-size:12px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
  color:var(--label2); margin:0 0 8px }
input[type=password],input[type=text]{ width:100%; font:inherit; font-size:20px; color:var(--label);
  background:rgba(118,118,128,.24); border:0; border-radius:12px; padding:13px 14px; outline:none;
  -webkit-appearance:none; appearance:none }
input:focus{ box-shadow:0 0 0 3px rgba(0,145,255,.55) }
.hidden-user{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none }
button{ width:100%; margin-top:14px; font:inherit; font-weight:600; font-size:17px; color:#05060A;
  background:#FAFAFA; border:0; border-radius:9999px; padding:14px; cursor:pointer;
  transition:transform .2s var(--ease), opacity .2s var(--ease) }
button:active{ transform:scale(.97) }
button[disabled]{ opacity:.5 }
.msg{ min-height:22px; margin:12px 2px 0; font-size:14px; color:var(--label2) }
.msg.bad{ color:var(--bad) }
.status{ margin-top:18px; font-size:14px; color:var(--label2) }
.status .ok{ color:var(--ok) }
.bar{ height:4px; border-radius:2px; background:rgba(118,118,128,.3); overflow:hidden; margin-top:8px }
.bar i{ display:block; height:100%; width:0; background:var(--tint); transition:width .3s var(--ease) }
.hint{ margin-top:22px; padding:16px; border-radius:20px; background:rgba(0,145,255,.14);
  box-shadow:inset 0 0 0 1px rgba(0,145,255,.3); font-size:14px; text-align:left }
.hint b{ font-weight:600 }
.share{ display:inline-block; width:16px; height:16px; vertical-align:-3px }
[hidden]{ display:none !important }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important } }
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/app-icon-180.png" alt="">
  <h1>Japan · Itinerary</h1>
  <p class="sub" id="sub">Enter your passphrase to unlock the trip on this device.</p>

  <form class="card" id="form" autocomplete="on">
    <input class="hidden-user" type="text" name="username" autocomplete="username" value="japan-itinerary" tabindex="-1" aria-hidden="true">
    <label for="pw">Passphrase</label>
    <input id="pw" name="password" type="password" autocomplete="current-password"
      autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <button id="go" type="submit">Unlock</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <div class="status" id="status" aria-live="polite">
    <span id="statusText">Preparing offline copy…</span>
    <div class="bar" id="bar"><i id="barFill"></i></div>
  </div>

  <div class="hint" id="installHint" hidden>
    <b>Install on your iPhone:</b> tap
    <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <b>Share</b>, then <b>Add to Home Screen</b>. Open <b>Japan</b> from your Home Screen and unlock it there once, while you're online.
  </div>
</main>

<script>
(function(){
  'use strict';
  var ITER_FALLBACK = 600000;
  var $ = function(id){ return document.getElementById(id); };
  var form = $('form'), pw = $('pw'), go = $('go'), msg = $('msg');
  var statusText = $('statusText'), bar = $('bar'), barFill = $('barFill');
  var swReady = false, unlocked = false;

  function setMsg(t, bad){ msg.textContent = t || ''; msg.className = 'msg' + (bad ? ' bad' : ''); }
  function setStatus(t, pct, ok){
    statusText.innerHTML = '';
    var s = document.createElement('span'); if(ok) s.className = 'ok'; s.textContent = t;
    statusText.appendChild(s);
    if(pct == null){ bar.hidden = true; } else { bar.hidden = false; barFill.style.width = Math.round(pct * 100) + '%'; }
  }

  // iOS install hint (only in a Safari tab, not in the installed app)
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(isIOS && !standalone) $('installHint').hidden = false;

  if(!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB){
    setStatus('This browser can’t store the trip offline. On iPhone, open this page in Safari (not a private tab).', null);
    go.disabled = true;
    return;
  }

  // ---- key storage (shared with the service worker) ----
  function idb(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('jp-vault', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbPut(k, v){
    return idb().then(function(db){ return new Promise(function(res, rej){
      var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
      tx.oncomplete = function(){ db.close(); res(); }; tx.onerror = function(){ rej(tx.error); };
    }); });
  }

  // ---- crypto ----
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function normalize(p){ return String(p || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function deriveRaw(pass, salt, iter){
    var enc = new TextEncoder().encode(normalize(pass));
    return crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:salt, iterations:iter }, k, 256);
    }).then(function(bits){ return new Uint8Array(bits); });
  }
  function decrypt(raw, blob){
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function(k){
      return crypto.subtle.decrypt({ name:'AES-GCM', iv:blob.slice(0, 12) }, k, blob.slice(12));
    });
  }

  // ---- service worker ----
  function onSwMessage(e){
    var d = e.data || {};
    if(d.type === 'progress' && !swReady){
      setStatus('Saving for offline use… ' + d.done + ' of ' + d.total, d.total ? d.done / d.total : 0);
    } else if(d.type === 'ready'){
      markReady();
    } else if(d.type === 'error' && !swReady){
      setStatus('Couldn’t finish the offline copy (' + (d.message || 'network error') + '). Check your connection and reopen the app.', null);
    }
  }
  function markReady(){
    if(swReady) return;
    swReady = true;
    setStatus('Saved for offline use ✓', null, true);
    if(unlocked) enter();
  }
  navigator.serviceWorker.addEventListener('message', onSwMessage);
  navigator.serviceWorker.register('sw.js', { scope:'./' }).then(function(reg){
    if(reg.active && !reg.installing && !reg.waiting) markReady();
  }).catch(function(err){
    setStatus('Offline storage isn’t available here (' + err.message + ').', null);
  });
  navigator.serviceWorker.ready.then(function(){ markReady(); });
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

  function enter(){
    setMsg('Opening…');
    var reloading = false;
    var reload = function(){
      if(reloading) return; reloading = true;
      // Only the #fragment may differ, which wouldn't reload — set it, then reload for real.
      history.replaceState(null, '', location.pathname.replace(/index\.html$/, '') + (location.hash || '#/today'));
      location.reload();
    };
    if(navigator.serviceWorker.controller) return reload();
    navigator.serviceWorker.addEventListener('controllerchange', reload);
    setTimeout(reload, 4000); // the worker claims the page on activation; reload anyway as a fallback
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!pw.value){ return; }
    go.disabled = true; setMsg('Checking…');
    fetch('vault/meta.json', { cache:'no-cache' }).then(function(r){
      if(!r.ok) throw new Error('meta ' + r.status);
      return r.json();
    }).then(function(meta){
      var salt = b64(meta.salt);
      return deriveRaw(pw.value, salt, meta.iterations || ITER_FALLBACK).then(function(raw){
        return decrypt(raw, b64(meta.check)).then(function(){
          return idbPut('key', { raw: raw, salt: meta.salt });
        }, function(){ throw new Error('wrong'); });
      });
    }).then(function(){
      unlocked = true;
      setMsg('Unlocked ✓');
      if(swReady) enter(); else setMsg('Unlocked ✓ — finishing the offline copy, this opens automatically.');
    }).catch(function(err){
      go.disabled = false;
      if(err && err.message === 'wrong'){ setMsg('That passphrase didn’t work. Spaces and capitals don’t matter.', true); pw.select(); }
      else { setMsg('Couldn’t check the passphrase (' + (err && err.message) + '). Are you online?', true); }
    });
  });
})();
</script>
</body>
</html>
